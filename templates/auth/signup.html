{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">✨</div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em;">Create Your Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Start fresh with your own personal financial decision assistant</p>
        </div>

        <form action="{{ url_for('signup') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Verma" value="{{ name|default('') }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email|default('') }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required minlength="6">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Preferred Currency</label>
                    <select name="currency" class="form-select">
                        <option value="₹">₹ INR (Indian Rupee)</option>
                        <option value="$">$ USD (US Dollar)</option>
                        <option value="€">€ EUR (Euro)</option>
                        <option value="£">£ GBP (British Pound)</option>
                        <option value="¥">¥ JPY (Japanese Yen)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; justify-content: center;">
                Create Fresh Account 🚀
            </button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600; color: var(--primary);">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
