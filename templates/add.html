{% extends "base.html" %}

{% block content %}
<div style="max-width: 620px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div class="page-header" style="margin-bottom: 1.75rem;">
            <div>
                <h1 class="page-title" style="font-size: 1.5rem;">
                    <span>➕ Log New Expense</span>
                </h1>
                <p class="page-subtitle">Enter transaction details. Our AI categorizer will tag it automatically.</p>
            </div>
        </div>

        <form action="{{ url_for('add') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Amount ({{ currency }}) *</label>
                <input type="number" step="0.01" min="0.01" name="amount" class="form-control" placeholder="0.00" required autofocus style="font-size: 1.25rem; font-weight: 700;">
            </div>

            <div class="form-group">
                <label class="form-label">Description *</label>
                <input type="text" name="description" id="descInput" class="form-control" placeholder="e.g. Swiggy Biryani Dinner, Uber cab, Netflix recharge" required>
                <div id="categoryPreview" style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">
                    ⚡ Category will be auto-assigned based on your keywords.
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Transaction Date</label>
                    <input type="date" name="date" class="form-control" value="{{ today }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Category Override</label>
                    <select name="category" id="catSelect" class="form-select">
                        <option value="">⚡ Auto-Detect with AI</option>
                        <option value="Food">🍔 Food & Dining</option>
                        <option value="Travel">🚕 Travel & Commute</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">🧾 Utilities & Bills</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Health">🩺 Health & Fitness</option>
                        <option value="Education">📚 Education</option>
                        <option value="Investments">📈 Investments</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select name="payment_method" class="form-select">
                    <option value="UPI">📱 UPI / QR Code</option>
                    <option value="Credit Card">💳 Credit Card</option>
                    <option value="Debit Card">💳 Debit Card</option>
                    <option value="Cash">💵 Cash</option>
                    <option value="Net Banking">🏦 Net Banking</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Notes (Optional)</label>
                <textarea name="notes" class="form-control" rows="2" placeholder="Add extra context, invoice number, or tax notes..."></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">
                <a href="{{ url_for('list_expenses') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary btn-lg">
                    <span>💾 Save Transaction</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
