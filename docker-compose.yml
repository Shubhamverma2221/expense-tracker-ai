version: '3.8'

services:
  web:
    build: .
    container_name: expense_ai_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=prod-super-secret-key-2026
      - FLASK_ENV=production
    volumes:
      - ./expenses.db:/app/expenses.db
    restart: unless-stopped
