{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">🔑</div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em;">Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Enter your email to receive recovery instructions</p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Account Email</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; justify-content: center;">
                Send Reset Link
            </button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Remember your password? <a href="{{ url_for('login') }}" style="font-weight: 600; color: var(--primary);">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
