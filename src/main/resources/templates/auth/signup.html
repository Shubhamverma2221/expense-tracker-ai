{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="card" style="padding: 2.25rem; box-shadow: var(--shadow-md);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 52px; height: 52px; font-size: 1.6rem;">✨</div>
            <h2 style="font-size: 1.65rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.025em;">Create Your Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Start fresh with your own personal financial intelligence assistant</p>
        </div>

        <form action="{{ url_for('signup') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="signupName">Full Name</label>
                <input type="text" id="signupName" name="name" class="form-control" placeholder="e.g. Rahul Verma" value="{{ name|default('') }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail" name="email" class="form-control" placeholder="name@example.com" value="{{ email|default('') }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="signupPassword">Password</label>
                <div class="password-input-group">
                    <input type="password" id="signupPassword" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" tabindex="0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
                <div class="password-input-group">
                    <input type="password" id="signupConfirmPassword" name="confirm_password" class="form-control" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" tabindex="0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="signupCurrency">Preferred Currency</label>
                    <select id="signupCurrency" name="currency" class="form-select">
                        <option value="₹">₹ INR (Indian Rupee)</option>
                        <option value="$">$ USD (US Dollar)</option>
                        <option value="€">€ EUR (Euro)</option>
                        <option value="£">£ GBP (British Pound)</option>
                        <option value="¥">¥ JPY (Japanese Yen)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; justify-content: center; font-size: 0.95rem;">
                Create Fresh Account 🚀
            </button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 700; color: var(--primary);">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
