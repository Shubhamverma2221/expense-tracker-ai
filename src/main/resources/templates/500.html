{% extends "base.html" %}

{% block content %}
<div class="empty-state" style="padding: 5rem 1rem; max-width: 600px; margin: 0 auto;">
    <div class="empty-icon" style="font-size: 3rem; width: 90px; height: 90px; color: var(--danger);">⚠️</div>
    <h1 style="font-size: 3rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem; letter-spacing: -0.03em;">
        500
    </h1>
    <h3 class="empty-title">Internal Server Error</h3>
    <p class="empty-desc">
        Something unexpected occurred while processing your financial request. Our automated error logging has recorded this event.
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">🔄 Retry & Reload</a>
        <a href="{{ url_for('contact_page') }}" class="btn btn-secondary btn-lg">Report Issue</a>
    </div>
</div>
{% endblock %}
