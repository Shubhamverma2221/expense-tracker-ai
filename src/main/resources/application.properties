server.port=${PORT:5000}

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:expenses.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Pebble Template Configuration
pebble.prefix=templates/
pebble.suffix=
pebble.cache=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/,file:./static/

# Logging
logging.level.com.expensetracker=INFO
logging.level.org.springframework.web=INFO
